            }
        }

        if (tests.length === 0) {
            const cols = 7;
            html += `<tr><td colspan="${cols}" style="text-align: center; color: #666; padding: 20px;">No matching tests found.</td></tr>`;
        }

        html += '</tbody></table>';
        return html;
    }

    async function renderUnblamedJobs() {
        const container = document.getElementById('unblamed-table-container');
        if (!container) return;
        if (!currentUnblamedJobs.length) { container.innerHTML = ''; unblamedGroups = null; return; }

        if (!unblamedGroups) {
            // Fetch all bug suggestions in parallel.
            const summaries = await Promise.all(currentUnblamedJobs.map(async job => {
                if (!job.jobId) return [];
                try {
                    const resp = await fetch(`${TH_BASE}/api/project/${currentRepo}/jobs/${job.jobId}/bug_suggestions/`);
                    if (!resp.ok) return [];
                    const suggestions = await resp.json();
                    return suggestions
                        .filter(s => s.search && s.search.trim())
                        .map(s => s.search.trim());
                } catch (e) {
                    return [];
                }
            }));

            // Attach cleaned summaries to jobs for display in expanded rows.
            for (let i = 0; i < currentUnblamedJobs.length; i++) {
                currentUnblamedJobs[i].cleanedSummary = cleanFailureSummary(summaries[i]);
            }

            // Group jobs by summary with UUIDs stripped for deduplication.
            unblamedGroups = new Map(); // groupKey -> { lines (UUID-stripped), jobs[] }
            for (let i = 0; i < currentUnblamedJobs.length; i++) {
                const key = failureSummaryGroupKey(summaries[i]);
                if (!unblamedGroups.has(key)) {
                    const displayLines = key.split('\n');
                    unblamedGroups.set(key, { lines: displayLines, jobs: [] });
                }
                unblamedGroups.get(key).jobs.push(currentUnblamedJobs[i]);
            }
        }

        let html = '<h3 style="margin: 20px 0 8px; font-size: 14px; color: #666;">Failed jobs with no specific test blamed</h3>';
        html += '<table class="failure-table">';
        html += '<thead><tr>';
        html += '<th class="no-sort" style="width: 24px">#</th>';
        html += '<th class="no-sort" style="width: 65px">Status</th>';
        html += '<th class="no-sort" style="width: 55px">OS</th>';
        html += '<th class="no-sort" style="width: 55px">Build</th>';
        html += '<th class="no-sort">Job</th>';
        html += '<th class="no-sort" style="width: 20px"></th>';
        html += '</tr></thead><tbody>';

        // Apply search filter: filter jobs within each group, skip empty groups.
        const filteredGroups = new Map();
        for (const [key, group] of unblamedGroups) {
            const jobs = currentSearchTerm
                ? group.jobs.filter(j => {
                    const matches =
                        j.jobName.toLowerCase().includes(currentSearchTerm) ||
                        group.lines.some(l => l.toLowerCase().includes(currentSearchTerm));
                    return currentSearchNegate ? !matches : matches;
                  })
                : group.jobs;
            if (jobs.length > 0) {
                filteredGroups.set(key, { lines: group.lines, jobs });
            }
        }

        if (filteredGroups.size === 0) { container.innerHTML = ''; return; }

        unblamedRenderedKeys = [...filteredGroups.keys()].sort((a, b) => filteredGroups.get(b).jobs.length - filteredGroups.get(a).jobs.length);
        const sortedGroupKeys = unblamedRenderedKeys;
        let groupIdx = 0;
        for (const key of sortedGroupKeys) {
            const group = filteredGroups.get(key);
            const allPlatforms = new Set();
            const allBuildTypes = new Set();
            for (const job of group.jobs) {
                allPlatforms.add(extractPlatform(job.jobName));
                for (const bt of extractBuildTypes(job.jobName)) allBuildTypes.add(bt);
            }
            const countClass = group.jobs.length >= 5 ? 'high' : group.jobs.length >= 2 ? 'medium' : 'low';
            const isExpanded = expandedUnblamed.has(key);

            html += `<tr class="clickable-row${isExpanded ? ' expanded' : ''}" onclick="toggleUnblamedGroup(${groupIdx})" title="Click to expand">`;
            html += `<td class="count-cell ${countClass}">${group.jobs.length}</td>`;
            html += `<td><span class="status-badge status-FAIL">FAIL</span></td>`;
            html += `<td class="badges-cell">${platformBadgesHtml(sortedPlatforms(allPlatforms))}</td>`;
            html += `<td class="badges-cell">${buildBadgesHtml(sortedBuildTypes(allBuildTypes))}</td>`;
            html += '<td class="test-info">';
            if (group.lines.length > 0) {
                const fullMessage = group.lines.join('\n');
                html += `<div class="inline-message" title="${escapeAttr(fullMessage)}">${escapeHtml(group.lines[0])}</div>`;
            } else {
                html += '<div class="inline-message" style="color:#999">(no failure summary available)</div>';
            }
            html += '</td>';
            html += '<td></td>';
            html += '</tr>';

            if (isExpanded) {
                for (const job of group.jobs) {
                    html += renderUnblamedJobRow(job);
                }
            }
            groupIdx++;
        }

        html += '</tbody></table>';
        container.innerHTML = html;
    }

    function cleanFailureSummary(lines) {
        // Filter out "exit status N" unless it's the only line.
        let cleaned = lines.length > 1
            ? lines.filter(l => !/^\[taskcluster:error\] exit status \d+$/.test(l))
            : lines;

        // Strip lines between "Aborting task..." and "task aborted".
        const result = [];
        let skipping = false;
        for (const line of cleaned) {
            if (/^\[taskcluster:error\] Aborting task/.test(line)) {
                result.push(line);
                skipping = true;
                continue;
            }
            if (skipping) {
                if (/^\[taskcluster:error\] task aborted/.test(line)) {
                    result.push(line);
                    skipping = false;
                }
                continue;
            }
            result.push(line);
        }
        return result;
    }

    function failureSummaryGroupKey(lines) {
        // Strip crash UUIDs so identical crash signatures group together.
        return cleanFailureSummary(lines)
            .map(l => l.replace(/^(PROCESS-CRASH \| )[0-9a-f-]{36} \| /, '$1'))
            .join('\n');
    }

    function linkifyBugNumbers(text) {
        return escapeHtml(text).replace(
            /\b(bug )(\d{4,})\b/gi,
            (_, prefix, id) =>
                `<a href="https://bugzilla.mozilla.org/show_bug.cgi?id=${id}" target="_blank" onclick="event.stopPropagation()">${prefix}${id}</a>`
        );
    }

    function linkifyCrashIds(line, job) {
        // Turn "PROCESS-CRASH | <uuid> | rest" into HTML with the UUID linked to the crash viewer.
        const m = line.match(/^(PROCESS-CRASH \| )([0-9a-f-]{36})( \| .*)$/);
        if (!m) return escapeHtml(line);
        const crashUrl = getCrashViewerUrl({ taskId: job.taskId, retryId: job.retryId, minidump: m[2] });
        if (!crashUrl) return escapeHtml(line);
        return `${escapeHtml(m[1])}<a href="${escapeAttr(crashUrl)}" target="_blank" onclick="event.stopPropagation()">${escapeHtml(m[2])}</a>${escapeHtml(m[3])}`;
    }

    function renderUnblamedJobRow(job) {
        const platform = extractPlatform(job.jobName);
        const builds = extractBuildTypes(job.jobName);
        const profilerUrl = getProfilerUrl({ taskId: job.taskId, retryId: job.retryId, jobName: job.jobName });
        const thJobUrl = `${TH_BASE}/jobs?repo=${currentRepo}&selectedTaskRun=${job.taskId}.${job.retryId}&revision=${currentRevision}`;

        let html = '<tr class="detail-row visible">';
        html += '<td class="count-cell"></td>';
        html += `<td><span class="status-badge status-FAIL">FAIL</span></td>`;
        html += `<td class="badges-cell">${platformBadgesHtml([platform])}</td>`;
        html += `<td class="badges-cell">${buildBadgesHtml(sortedBuildTypes(new Set(builds)))}</td>`;
        html += '<td class="test-info">';
        html += '<div class="job-header">';
        html += `<span class="job-name">${escapeHtml(job.jobName)}</span>`;
        html += ' <span class="job-links">';
        html += `<a href="${escapeAttr(profilerUrl)}" target="_blank" onclick="event.stopPropagation()">Profile</a>`;
        html += `<a href="${escapeAttr(thJobUrl)}" target="_blank" onclick="event.stopPropagation()">Treeherder</a>`;
        html += '</span>';
        html += '</div>';
        if (job.cleanedSummary) {
            for (const line of job.cleanedSummary) {
                if (/^PROCESS-CRASH \| [0-9a-f-]{36} \| /.test(line)) {
                    html += `<div class="inline-message">${linkifyCrashIds(line, job)}</div>`;
                } else {
                    html += `<div class="inline-message">${escapeHtml(line)}</div>`;
                }
            }
        }
        html += '</td>';
        html += '<td></td>';
        html += '</tr>';
        return html;
    }

    function toggleUnblamedGroup(groupIdx) {
        const key = unblamedRenderedKeys[groupIdx];
        if (expandedUnblamed.has(key)) {
            expandedUnblamed.delete(key);
        } else {
            expandedUnblamed.add(key);
        }
        renderUnblamedJobs();
    }

    function renderTestDetailRows(test, hasRepro) {
        let html = '';

        // Group instances by job
        const byJob = new Map();
        for (const inst of test.instances) {
            const key = `${inst.taskId}.${inst.retryId}`;
            if (!byJob.has(key)) {
                byJob.set(key, {
                    jobName: inst.jobName,
                    taskId: inst.taskId,
                    retryId: inst.retryId,
                    instances: [],
                });
            }
            byJob.get(key).instances.push(inst);
        }

        for (const [, job] of byJob) {
            const platform = extractPlatform(job.jobName);
            const builds = extractBuildTypes(job.jobName);
            const profilerUrl = getProfilerUrl(
                { taskId: job.taskId, retryId: job.retryId, jobName: job.jobName },
                test.path.split('/').pop()
            );
            const thJobUrl = `${TH_BASE}/jobs?repo=${currentRepo}&selectedTaskRun=${job.taskId}.${job.retryId}&revision=${currentRevision}`;

            // Collect statuses for this job
            const jobStatuses = new Set();
            for (const inst of job.instances) {
                jobStatuses.add(inst.status.replace(/-PARALLEL|-SEQUENTIAL/, ''));
            }

            html += '<tr class="detail-row visible">';

            const jobIntermittent = job.instances.every(i => i.intermittent);

            // # column - intermittent icon if applicable
            html += `<td class="count-cell">${jobIntermittent ? MITTEN : ''}</td>`;

            // Status column
            html += '<td>';
            for (const s of jobStatuses) {
                html += `<span class="status-badge status-${s}">${s}</span> `;
            }
            html += '</td>';

            // OS column
            html += `<td class="badges-cell">${platformBadgesHtml([platform])}</td>`;

            // Build column
            html += `<td class="badges-cell">${buildBadgesHtml(sortedBuildTypes(new Set(builds)))}</td>`;

            // Flakiness column (empty for detail rows)
            html += '<td></td>';

            // Test column - job name, links, assertions
            // Collect crash viewer URLs for this job's instances.
            const crashUrls = new Set();
            for (const inst of job.instances) {
                if (inst.minidump) {
                    crashUrls.add(getCrashViewerUrl({ taskId: inst.taskId, retryId: inst.retryId, minidump: inst.minidump }));
                }
            }

            const jobKey = `${job.taskId}.${job.retryId}`;

            // A test that fails is rerun in the harness's "retry" phase, marked on
            // each instance via isRetry. Split the failures into the initial run and
            // the retry, ordered by time. When it failed initially but ultimately
            // passed, the passing run isn't a failure instance, so we say so.
            const sortedInstances = [...job.instances].sort((a, b) => a.timestamp - b.timestamp);
            const initialInstances = sortedInstances.filter(i => !i.isRetry);
            const retryInstances = sortedInstances.filter(i => i.isRetry);
            const passedOnRetry = sortedInstances.some(i => i.passedOnRetry);
            const showRuns = retryInstances.length > 0 || (passedOnRetry && initialInstances.length > 0);

            const jobProfile = findUploadedProfile(job.instances);

            html += '<td class="test-info">';
            html += '<div class="job-header">';
            html += `<span class="job-name">${escapeHtml(job.jobName)}</span>`;
            // For a lone failure run, the test-run failure profile sits by the job
            // name; the links below are job-level (resource profile, crash, job).
            if (!showRuns && jobProfile) html += profilerLinkHtml(test.path, jobKey, jobProfile);
            html += ' <span class="job-links">';
            html += `<a href="${escapeAttr(profilerUrl)}" target="_blank">Profile</a>`;
            for (const crashUrl of crashUrls) {
                if (crashUrl) html += `<a href="${escapeAttr(crashUrl)}" target="_blank">Crash</a>`;
            }
            html += `<a href="${escapeAttr(thJobUrl)}" target="_blank">Treeherder</a>`;
            html += '</span>';
            html += '</div>';

            // All assertions — collect then cap, grouped by run with a header that
            // carries that run's own failure-profile icon.
            const allItems = [];
            const appendInstance = (inst, cls) => {
                if (inst.crashSignature) {
                    const crashViewerUrl = inst.minidump ? getCrashViewerUrl({ taskId: inst.taskId, retryId: inst.retryId, minidump: inst.minidump }) : '';
                    if (crashViewerUrl) {
                        allItems.push({ cls, html: `<a href="${escapeAttr(crashViewerUrl)}" target="_blank" class="crash-sig">${escapeHtml(inst.crashSignature)}</a>` });
                    } else {
                        allItems.push({ cls, html: `<span class="crash-sig">${escapeHtml(inst.crashSignature)}</span>` });
                    }
                }
                const msgs = inst.allMessages && inst.allMessages.length
                    ? inst.allMessages
                    : (inst.message ? [{ message: inst.message }] : []);
                for (const m of msgs) {
                    // The "profile uploaded in ..." notice is shown as the icon instead.
                    if (extractUploadedProfileName(m.message)) continue;
                    allItems.push({ cls, html: escapeHtml(m.message), stack: m.stack });
                }
            };
            const appendGroup = (label, cls, instances) => {
                if (!instances.length) return;
                if (showRuns) {
                    const withProfile = instances.find(instanceUploadedProfile);
                    const icon = withProfile ? profilerLinkHtml(test.path, jobKey, instanceUploadedProfile(withProfile)) : '';
                    allItems.push({ separator: true, label, cls, icon });
                }
                for (const inst of instances) appendInstance(inst, showRuns ? cls : '');
            };
            appendGroup('Initial', 'phase-initial', initialInstances);
            appendGroup('Retry', 'phase-retry', retryInstances);
            // Failed initially but passed on the retry: no failure instance exists
            // for the retry, so note the outcome on a single plain line (it's a
            // non-issue — no badge, no vertical rule).
            if (showRuns && passedOnRetry && retryInstances.length === 0) {
                allItems.push({ html: '<span class="repro-pass">Passed on retry</span>' });
            }

            // Known prefix → searchfox source path mapping (prefix is hidden)
            const SOURCE_PREFIX_MAP = [
                ['chrome://mochitests/content/browser/', ''],
                ['chrome://mochikit/content/', 'testing/mochitest/'],
            ];

            function colorizeJsFile(file, funcName) {
                // Split "prefix/path:line:col" or "prefix/path:line"
                const lineMatch = file.match(/^(.+?):(\d+)(:\d+)?$/);
                const filePart = lineMatch ? lineMatch[1] : file;
                const lineNum = lineMatch ? lineMatch[2] : null;
                const lineSuffix = lineMatch ? `:${lineMatch[2]}${lineMatch[3] || ''}` : '';
                const fileName = filePart.split('/').pop();

                // Check for known prefix → hide it entirely, link to source
                for (const [prefix, replacement] of SOURCE_PREFIX_MAP) {
                    if (filePart.startsWith(prefix)) {
                        const srcPath = replacement + filePart.slice(prefix.length);
                        const href = escapeAttr('https://searchfox.org/mozilla-central/source/' + srcPath + (lineNum ? '#' + lineNum : ''));
                        let fileHtml = `<span class="stack-file">${escapeHtml(srcPath)}</span>`;
                        if (lineSuffix) fileHtml += `<span class="stack-line">${escapeHtml(lineSuffix)}</span>`;
                        return `<a href="${href}" target="_blank">${fileHtml}</a>`;
                    }
                }

                // Unknown scheme (resource://, chrome://browser/, etc.)
                // Grey out the prefix, link to searchfox search
                const schemeMatch = filePart.match(/^(.+\/)([^/]+)$/);
                let prefixHtml = '';
                let pathPart = filePart;
                if (schemeMatch) {
                    prefixHtml = `<span class="stack-prefix">${escapeHtml(schemeMatch[1])}</span>`;
                    pathPart = schemeMatch[2];
                }

                let fileHtml = prefixHtml + `<span class="stack-file">${escapeHtml(pathPart)}</span>`;
                if (lineSuffix) fileHtml += `<span class="stack-line">${escapeHtml(lineSuffix)}</span>`;

                // Link to searchfox search using function name + filename
                if (fileName) {
                    const params = new URLSearchParams({ path: fileName, case: 'true', regexp: 'false' });
                    if (funcName) params.set('q', funcName);
                    const href = escapeAttr('https://searchfox.org/mozilla-central/search?' + params);
                    fileHtml = `<a href="${href}" target="_blank">${fileHtml}</a>`;
                }
                return fileHtml;
            }

            function colorizeLeakDesc(desc) {
                // Function names after "JS Function - " in bold.
                const funcMatch = desc.match(/^(JS Function - )(.+)$/);
                if (funcMatch) {
                    return `<span class="stack-desc">${escapeHtml(funcMatch[1])}</span><span class="stack-func">${escapeHtml(funcMatch[2])}</span>`;
                }
                // Split on paths (resource://, chrome://) and colorize them as searchfox links.
                const parts = desc.split(/((?:chrome|resource):\/\/[^\s]+)/);
                return parts.map(part =>
                    /^(?:chrome|resource):\/\//.test(part)
                        ? colorizeJsFile(part, null)
                        : `<span class="stack-desc">${escapeHtml(part)}</span>`
                ).join('');
            }

            function colorizeStack(stack) {
                return stack.split('\n').map(line => {
                    // Leak stack: "name — description @  0xaddr"
                    const leakMatch = line.match(/^(.+?) — (.+?) @ {2}(0x[0-9a-f]+)$/);
                    if (leakMatch) {
                        return `<span class="stack-func">${escapeHtml(leakMatch[1])}</span><span class="stack-sep"> — </span>${colorizeLeakDesc(leakMatch[2])}<span class="stack-sep"> @ </span><span class="stack-addr">${escapeHtml(leakMatch[3])}</span>`;
                    }
                    // Leak stack without description: "name @  0xaddr"
                    const leakSimple = line.match(/^(.+?) @ {2}(0x[0-9a-f]+)$/);
                    if (leakSimple) {
                        return `<span class="stack-func">${escapeHtml(leakSimple[1])}</span><span class="stack-sep"> @ </span><span class="stack-addr">${escapeHtml(leakSimple[2])}</span>`;
                    }
                    // JS stack: "func @ file:line:col"
                    const jsMatch = line.match(/^(.+?) @ (.+)$/);
                    if (jsMatch) {
                        return `<span class="stack-func">${escapeHtml(jsMatch[1])}</span><span class="stack-sep"> @ </span>${colorizeJsFile(jsMatch[2], jsMatch[1])}`;
                    }
                    return escapeHtml(line);
                }).join('\n');
            }

            function renderItem(item) {
                if (item.separator) {
                    return `<span class="chip">${escapeHtml(item.label)}</span>${item.icon || ''}`;
                }
                let li = item.html;
                if (item.stack) {
                    li += `<pre class="assertion-stack">${colorizeStack(item.stack)}</pre>`;
                }
                return li;
            }
            const itemLi = (item, hiddenId) => {
                const classes = [];
                if (item.separator) classes.push('phase-label');
                else if (item.cls) classes.push('phase-body');
                if (item.cls) classes.push(item.cls);
                if (hiddenId) classes.push('assertion-hidden');
                const classAttr = classes.length ? ` class="${classes.join(' ')}"` : '';
                const hiddenAttr = hiddenId ? ` data-group="${hiddenId}" style="display:none"` : '';
                return `<li${classAttr}${hiddenAttr}>${renderItem(item)}</li>`;
            };

            const MAX_VISIBLE = 10;
            html += '<ul class="assertion-list">';
            for (let i = 0; i < Math.min(allItems.length, MAX_VISIBLE); i++) {
                html += itemLi(allItems[i]);
            }
            if (allItems.length > MAX_VISIBLE) {
                const hiddenId = `hidden-${job.taskId}-${job.retryId}`;
                const remaining = allItems.length - MAX_VISIBLE;
                for (let i = MAX_VISIBLE; i < allItems.length; i++) {
                    html += itemLi(allItems[i], hiddenId);
                }
                html += `</ul><a class="show-more-link" onclick="toggleAssertions(this, '${hiddenId}')">show ${remaining} more</a>`;
            } else {
                html += '</ul>';
            }

            html += '</td>';
            html += '<td></td>';
            html += '</tr>';
        }

        // Reproduction detail section
        if (hasRepro) {
            const rs = reproState.get(test.path);
            if (rs) {
                html += renderReproDetailRow(rs, hasRepro);
            }
        }

        return html;
    }

    function renderReproDetailRow(rs, hasRepro) {
        const cols = 7;
        const rowId = `repro-detail-${rs.testPath || ''}`;
        let cls = 'pending';
        let icon = '&#x23F3;';
        let label = 'Reproduction';

        if (rs.state === 'reproduced') {
            cls = 'reproduced';
            icon = '&#x2713;';
            label = 'Reproduced';
        } else if (rs.state === 'not_reproduced') {
            cls = 'not-reproduced';
            icon = '&#x2717;';
            label = 'Not reproduced';
        } else if (rs.state === 'error') {
            cls = 'error';
            icon = '!';
            label = 'Reproduction error';
        } else if (rs.state === 'no_match') {
            cls = 'no-match';
            icon = '&#x26A0;';
            label = 'No matching local config';
        } else if (rs.state === 'queued') {
            label = 'Queued for reproduction';
        } else if (rs.state === 'running') {
            label = 'Reproducing...';
        }

        let html = `<tr class="detail-row visible" id="${escapeAttr(rowId)}">`;
        html += `<td colspan="${cols}">`;

        // Show past attempts (not reproduced on earlier configs)
        if (rs.pastAttempts && rs.pastAttempts.length > 0) {
            for (const past of rs.pastAttempts) {
                let pastMeta = `Config: ${past.config}`;
                if (past.duration != null) pastMeta += ` &middot; ${past.duration}s`;
                if (past.summary) pastMeta += ` &middot; ${escapeHtml(past.summary)}`;
                html += '<div class="repro-detail not-reproduced" style="margin-bottom: 4px">';
                html += '<div class="repro-detail-header"><span class="repro-icon repro-not-reproduced">&#x2717;</span> Not reproduced</div>';
                html += `<div class="repro-detail-meta">${pastMeta}</div>`;
                if (past.runId) {
                    const pastLogUrl = `http://localhost:3000/api/runs/${encodeURIComponent(past.runId)}/log?format=text`;
                    const pastProfilerUrl = getProfilerUrl({
                        profile: `http://localhost:3000/api/runs/${encodeURIComponent(past.runId)}/profile`,
                        profileName: `mach test ${rs.testPath || ''} (${past.config || 'unknown'})`,
                    });
                    html += '<div class="repro-links">';
                    html += `<a href="${pastLogUrl}" target="_blank">View log</a>`;
                    html += `<a href="${pastProfilerUrl}" target="_blank">Profile</a>`;
                    html += '</div>';
                    html += `<div class="repro-log-viewer" id="repro-log-${escapeAttr(past.runId)}"></div>`;
                }
                html += '</div>';
            }
        }

        html += `<div class="repro-detail ${cls}">`;
        html += `<div class="repro-detail-header"><span class="repro-icon repro-${cls}">${icon}</span> ${escapeHtml(label)}</div>`;

        if (rs.config) {
            let meta = `Config: ${rs.config}`;
            if (rs.duration != null) meta += ` &middot; ${rs.duration}s`;
            if (rs.summary) meta += ` &middot; ${escapeHtml(rs.summary)}`;
            if (rs.exitCode != null) meta += ` &middot; exit ${rs.exitCode}`;
            html += `<div class="repro-detail-meta">${meta}</div>`;
        }

        if (rs.error) {
            html += `<div class="repro-detail-meta" style="color: #c00">${escapeHtml(rs.error)}</div>`;
        }

        const finished = rs.runId && rs.state !== 'queued' && rs.state !== 'running';
        if (finished) {
            const profilerUrl = getProfilerUrl({
                profile: `http://localhost:3000/api/runs/${encodeURIComponent(rs.runId)}/profile`,
                profileName: `mach test ${rs.testPath || ''} (${rs.config || 'unknown'})`,
            });

            const logUrl = `http://localhost:3000/api/runs/${encodeURIComponent(rs.runId)}/log?format=text`;
            html += '<div class="repro-links">';
            html += `<a href="${logUrl}" target="_blank">View log</a>`;
            html += `<a href="${profilerUrl}" target="_blank">Profile</a>`;
            html += '</div>';
            html += `<div class="repro-log-viewer" id="repro-log-${escapeAttr(rs.runId)}"></div>`;
        }

        html += '</div></td></tr>';
        return html;
    }

    const reproLogCache = new Map();
    function loadVisibleReproLogs() {
        for (const viewer of document.querySelectorAll('.repro-log-viewer')) {
            const runId = viewer.id.replace('repro-log-', '');
            if (!runId || viewer.dataset.loaded) continue;
            viewer.dataset.loaded = '1';

            if (reproLogCache.has(runId)) {
                viewer.innerHTML = reproLogCache.get(runId);
                continue;
            }

            viewer.textContent = 'Loading log...';
            fetch(`http://localhost:3000/api/runs/${encodeURIComponent(runId)}/log`)
                .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.text(); })
                .then(text => {
                    const html = formatStructuredLog(text);
                    reproLogCache.set(runId, html);
                    viewer.innerHTML = html;
                })
                .catch(e => { viewer.textContent = `Failed to load log: ${e.message}`; });
        }
    }

    function formatStructuredLog(text) {
        const lines = text.trim().split('\n');
        let html = '';
        for (const line of lines) {
            let entry;
            try { entry = JSON.parse(line); } catch { continue; }

            const action = entry.action;
            if (action === 'suite_start') {
                html += `<div class="log-line log-test-header">Suite: ${escapeHtml(entry.name || '')}</div>`;
            } else if (action === 'test_start') {
                html += `<div class="log-line log-test-header">TEST-START | ${escapeHtml(entry.test || '')}</div>`;
            } else if (action === 'test_status') {
                const cls = entry.status === 'PASS' ? 'log-pass' : 'log-fail';
                const expected = entry.expected && entry.status !== entry.expected ? ` (expected ${entry.expected})` : '';
                html += `<div class="log-line ${cls}">${escapeHtml(entry.status)}${escapeHtml(expected)} | ${escapeHtml(entry.subtest || '')}`;
                if (entry.message) html += ` - ${escapeHtml(entry.message)}`;
                html += '</div>';
                if (entry.stack) {
                    html += `<div class="log-line log-stack">${escapeHtml(entry.stack)}</div>`;
                }
            } else if (action === 'test_end') {
                const cls = entry.status === 'PASS' || entry.status === 'OK' ? 'log-pass' : 'log-fail';
                const expected = entry.expected && entry.status !== entry.expected ? ` (expected ${entry.expected})` : '';
                html += `<div class="log-line ${cls}">TEST-END | ${escapeHtml(entry.test || '')} - ${escapeHtml(entry.status)}${escapeHtml(expected)}`;
                if (entry.message) html += ` - ${escapeHtml(entry.message)}`;
                html += '</div>';
            } else if (action === 'log') {
                const level = (entry.level || '').toUpperCase();
                let cls = 'log-info';
                if (level === 'WARNING') cls = 'log-warn';
                else if (level === 'ERROR' || level === 'CRITICAL') cls = 'log-error';
                // Skip noisy mozinfo env variables (indented key: value lines from mach-test)
                if (entry.source === 'mach-test' && entry.message && /^    \w+:/.test(entry.message)) continue;
                html += `<div class="log-line ${cls}">${escapeHtml(entry.message || '')}</div>`;
            } else if (action === 'crash') {
                html += `<div class="log-line log-fail">CRASH | ${escapeHtml(entry.test || '')} - ${escapeHtml(entry.signature || entry.message || '')}</div>`;
            } else if (action === 'process_output') {
                // Skip noisy process output unless it has useful content
                if (entry.data && (entry.data.includes('MEMORY STAT') || entry.data.includes('Exiting due to channel error'))) continue;
                if (entry.data) html += `<div class="log-line log-info">${escapeHtml(entry.data)}</div>`;
            }
            // Skip: suite_end, shutdown, process_start, process_exit, group_start, group_end
        }
        return html;
    }

    function sortTable(column) {
        if (currentSort.column === column) {
            currentSort.ascending = !currentSort.ascending;
        } else {
            currentSort.column = column;
            currentSort.ascending = column === 'test';
        }
        renderTable();
    }

    // ===== 21-day flakiness data =====

    const flakinessCache = new Map(); // testPath -> { stats, hasMatchingMessage }
    let flakinessWorker = null;

    function initFlakinessWorker() {
        if (flakinessWorker) return flakinessWorker;
        // Embed shared helpers (already loaded via <script>) in the worker.
        const sharedCode = [getChunkIndex, getCountAtIndex, findTest, computeTestStats]
            .map(fn => fn.toString()).join('\n');
        const workerCode = sharedCode + `
self.onmessage = function(e) {
    const { buffer, tests } = e.data;
    try {
        const json = new TextDecoder().decode(buffer);
        const data = JSON.parse(json);
        const results = [];
        for (const { path, tryMessages, hasTimeout, hasCrash } of tests) {
            const testInfo = findTest(data, path);
            if (!testInfo) { results.push({ path, found: false }); continue; }
            const stats = computeTestStats(data, testInfo.testId);
            // Timeouts and crashes don't always have messages in the data files,
            // so also match by checking if history has the same status type.
            const hasMatchingMessage = stats.failureMessages.some(m => tryMessages.includes(m))
                || (hasTimeout && stats.timeoutCount > 0)
                || (hasCrash && stats.crashCount > 0);
            // Strip failureMessages to avoid transferring large strings back.
            delete stats.failureMessages;
            results.push({ path, found: true, stats, hasMatchingMessage });
        }
        self.postMessage({ results });
    } catch (err) {
        self.postMessage({ error: err.message });
    }
};`;
        const blob = new Blob([workerCode], { type: 'application/javascript' });
        flakinessWorker = new Worker(URL.createObjectURL(blob));
        return flakinessWorker;
    }

    function processInWorker(worker, buffer, tests) {
        return new Promise(resolve => {
            const handler = e => {
                worker.removeEventListener('message', handler);
                resolve(e.data);
            };
            worker.addEventListener('message', handler);
            // Convert tryMessages Sets to arrays for structured clone.
            const testsForWorker = tests.map(t => ({ path: t.path, tryMessages: [...t.tryMessages], hasTimeout: t.hasTimeout, hasCrash: t.hasCrash }));
            worker.postMessage({ buffer, tests: testsForWorker }, [buffer]);
        });
    }

    async function fetchFlakinessData(tests) {
        const worker = initFlakinessWorker();

        // Build per-test info with try failure messages.
        const testEntries = tests.map(test => {
            const tryMessages = new Set();
            let hasTimeout = false;
            let hasCrash = false;
            for (const inst of test.instances) {
                if (inst.message) tryMessages.add(inst.message);
                if (inst.crashSignature) tryMessages.add(inst.crashSignature);
                if (inst.status.startsWith('TIMEOUT')) hasTimeout = true;
                if (inst.status.startsWith('CRASH')) hasCrash = true;
            }
            return { path: test.path, tryMessages, hasTimeout, hasCrash };
        });

        // Group tests by chunk file (harness + chunkHex).
        function buildChunkMap(entries) {
            const chunkMap = new Map();
            for (const entry of entries) {
                const harness = detectHarness(entry.path);
                const chunkHex = getChunkIndex(entry.path).toString(16).padStart(2, '0');
                const key = `${harness}-${chunkHex}`;
                if (!chunkMap.has(key)) chunkMap.set(key, []);
                chunkMap.get(key).push(entry);
            }
            return chunkMap;
        }

        // Order chunks by the position of their highest-priority test in the table.
        const testOrder = new Map(tests.map((t, i) => [t.path, i]));
        function sortChunks(chunkMap) {
            return [...chunkMap.entries()].sort((a, b) => {
                const minA = Math.min(...a[1].map(t => testOrder.get(t.path) ?? Infinity));
                const minB = Math.min(...b[1].map(t => testOrder.get(t.path) ?? Infinity));
                return minA - minB;
            });
        }

        async function processChunks(chunkMap) {
            const notFound = [];
            const sorted = sortChunks(chunkMap);

            // Pipeline: fetch next file while worker processes the current one.
            let workerPromise = null;
            let workerTests = null;

            async function drainWorker() {
                if (!workerPromise) return;
                try {
                    const result = await workerPromise;
                    if (result.error) { notFound.push(...workerTests); }
                    else {
                        for (const r of result.results) {
                            if (!r.found) { notFound.push(workerTests.find(t => t.path === r.path)); continue; }
                            flakinessCache.set(r.path, { stats: r.stats, hasMatchingMessage: r.hasMatchingMessage });
                            updateFlakinessDisplay(r.path, r.stats, r.hasMatchingMessage);
                        }
                    }
                } catch (e) {
                    notFound.push(...workerTests);
                }
                workerPromise = null;
                workerTests = null;
            }

            // Sequential fetches, but overlap fetch N+1 with worker processing N.
            let pendingFetch = null;
            for (let i = 0; i < sorted.length; i++) {
                const [chunkFile, chunkTests] = sorted[i];
                // Use prefetched result if available, otherwise fetch now.
                const fetched = await (pendingFetch || fetchData(`${chunkFile}.json`)
                    .then(r => r.ok ? r.arrayBuffer() : null).catch(() => null));
                pendingFetch = null;
                if (!fetched) { notFound.push(...chunkTests); continue; }
                // Drain previous worker result before sending new buffer.
                await drainWorker();
                workerTests = chunkTests;
                workerPromise = processInWorker(worker, fetched, chunkTests);
                // Start fetching next chunk while worker processes this one.
                if (i + 1 < sorted.length) {
                    const [nextFile] = sorted[i + 1];
                    pendingFetch = fetchData(`${nextFile}.json`)
                        .then(r => r.ok ? r.arrayBuffer() : null).catch(() => null);
                }
            }
            await drainWorker();
            return notFound;
        }

        // First pass with detected harness.
        const notFound = await processChunks(buildChunkMap(testEntries));

        // Retry not-found tests with the other harness.
        if (notFound.length > 0) {
            const altMap = new Map();
            for (const entry of notFound) {
                const altHarness = detectHarness(entry.path) === 'xpcshell' ? 'mochitest' : 'xpcshell';
                const chunkHex = getChunkIndex(entry.path).toString(16).padStart(2, '0');
                const key = `${altHarness}-${chunkHex}`;
                if (!altMap.has(key)) altMap.set(key, []);
                altMap.get(key).push(entry);
            }
            const stillNotFound = await processChunks(altMap);
            for (const entry of stillNotFound) {
                updateFlakinessDisplay(entry.path, null, false);
            }
        }

        worker.terminate();
        flakinessWorker = null;
    }

    function formatFailRate(rate) {
        return rate.toFixed(1) + '%';
    }

    function updateFlakinessDisplay(testPath, stats, hasMatchingMessage) {
        const el = document.getElementById(`flakiness-${testPath}`);
        if (!el) return;

        const histUrl = withDevParams(`test.html?test=${encodeURIComponent(testPath)}`);

        if (!stats) {
            el.textContent = '';
            el.className = 'flakiness-cell';
            el.title = '';
            return;
        }

        const failCount = stats.failCount + stats.crashCount + stats.timeoutCount;
        const failRate = stats.runCount > 0 ? (failCount / stats.runCount * 100) : 0;

        if (failRate === 0) {
            el.className = 'flakiness-cell flaky-new';
            el.innerHTML = `<a href="${escapeAttr(histUrl)}" target="_blank" onclick="event.stopPropagation()" title="${stats.runCount} runs, 100% pass rate over 21 days — this failure is new">&#x26a0;&#xfe0f;</a>`;
        } else {
            const pct = formatFailRate(failRate);
            if (hasMatchingMessage) {
                el.className = 'flakiness-cell flaky-msg';
                el.innerHTML = `<a href="${escapeAttr(histUrl)}" target="_blank" onclick="event.stopPropagation()" title="${pct} failure rate over 21 days (${stats.runCount} runs) — same failure message seen in history">${MITTEN}${pct}</a>`;
            } else {
                el.className = 'flakiness-cell flaky';
                el.innerHTML = `<a href="${escapeAttr(histUrl)}" target="_blank" onclick="event.stopPropagation()" title="${pct} failure rate over 21 days (${stats.runCount} runs)">${pct}</a>`;
            }
        }
    }

    function toggleTest(path) {
        if (expandedTests.has(path)) {
            expandedTests.delete(path);
        } else {
            expandedTests.add(path);
        }
        renderTable();
    }

    function getExtraArgs() {
        const val = document.getElementById('extra-args')?.value?.trim() || '';
        return val ? val.split(/\s+/) : [];
    }

    function getMachCmd(testPath) {
        const extra = getExtraArgs();
        const parts = ['./mach test', testPath, '--headless'];
        if (extra.length) parts.push(...extra);
        return parts.join(' ');
    }

    // When a test fails, the harness captures a Gecko profile at the moment of
    // failure and uploads it as a task artifact, logging a message like:
    //   "Found unexpected failures during the test; profile uploaded in profile_foo.js.json"
    // Extract the artifact filename from such a message.
    function extractUploadedProfileName(message) {
        const m = message && message.match(/profile uploaded in (profile_\S+\.json)/);
        return m ? m[1] : null;
    }

    function uploadedProfileArtifactUrl(taskId, retryId, filename) {
        return `https://firefox-ci-tc.services.mozilla.com/api/queue/v1/task/${taskId}/runs/${retryId}/artifacts/public/test_info/${filename}`;
    }

    function messagesOf(inst) {
        return inst.allMessages && inst.allMessages.length
            ? inst.allMessages.map(m => m.message)
            : (inst.message ? [inst.message] : []);
    }

    // List the messages logged on a set of instances (deduped, excluding the
    // "profile uploaded" notice itself).
    function instanceMessages(instances) {
        const seen = new Set();
        const out = [];
        for (const inst of instances) {
            for (const m of messagesOf(inst)) {
                if (!m || extractUploadedProfileName(m) || seen.has(m)) continue;
                seen.add(m);
                out.push(m);
            }
        }
        return out;
    }

    // The failure profile uploaded by a single test run (instance), or null.
    // Each run uploads its own artifact, so this is read per-instance.
    function instanceUploadedProfile(inst) {
        for (const msg of messagesOf(inst)) {
            const filename = extractUploadedProfileName(msg);
            if (filename) {
                return { taskId: inst.taskId, retryId: inst.retryId, filename, jobName: inst.jobName };
            }
        }
        return null;
    }

    // Find the first instance that uploaded a failure profile, or null.
    function findUploadedProfile(instances) {
        for (const inst of instances) {
            const up = instanceUploadedProfile(inst);
            if (up) return up;
        }
        return null;
    }

    // The Firefox Profiler URL for an uploaded failure profile. No markerSearch:
    // this is a captured Gecko profile, not the resource-usage timeline.
    function failureProfilerUrl(testPath, prof) {
        const artifactUrl = uploadedProfileArtifactUrl(prof.taskId, prof.retryId, prof.filename);
        const leaf = testPath.split('/').pop();
        return getProfilerUrl({ profile: artifactUrl, profileName: `${prof.jobName} — ${leaf}` });
    }

    // Real link that opens the uploaded failure profile in the Firefox Profiler
    // (so the destination shows in the status bar on hover). Alt+click copies a
    // profiler-cli debugging prompt instead of navigating.
    // jobKey restricts to a single run; null means the whole test (aggregate row).
    function profilerLinkHtml(testPath, jobKey, prof) {
        const url = failureProfilerUrl(testPath, prof);
        const hint = ' (Alt+click: copy profiler-cli debug prompt)';
        const keyArg = jobKey ? `'${escapeAttr(jobKey)}'` : 'null';
        return `<a class="profiler-cmd" href="${escapeAttr(url)}" target="_blank" rel="noopener" onclick="return onProfilerClick(event, '${escapeAttr(testPath)}', ${keyArg})" title="Open the failure profile in the Firefox Profiler${hint}"></a>`;
    }

    // Returns true to let the link navigate normally; intercepts Alt+click
    // to copy a profiler-cli debugging prompt.
    function onProfilerClick(event, testPath, jobKey) {
        event.stopPropagation();
        if (event.altKey) {
            event.preventDefault();
            copyProfilerDebugPrompt(testPath, jobKey, event.currentTarget);
            return false;
        }
        return true;
    }

    function copyProfilerDebugPrompt(testPath, jobKey, el) {
        const test = currentFailures?.tests.find(t => t.path === testPath);
        if (!test) return;
        const scope = jobKey
            ? test.instances.filter(i => `${i.taskId}.${i.retryId}` === jobKey)
            : test.instances;
        const prof = findUploadedProfile(scope);
        if (!prof) return;
        const artifactUrl = uploadedProfileArtifactUrl(prof.taskId, prof.retryId, prof.filename);

        // Messages from the same run that produced the profile.
        const profKey = `${prof.taskId}.${prof.retryId}`;
        const runInstances = test.instances.filter(i => `${i.taskId}.${i.retryId}` === profKey);
        const msg = instanceMessages(runInstances).join('\n') || test.commonMessage || '';
        const prompt = `Use profiler-cli to debug this Firefox test failure.

Test: ${testPath}
Job: ${prof.jobName}

Failure message:
${msg}

A Gecko profile was captured at the moment of failure. Load it with:
\`profiler-cli load "${artifactUrl}"\`

Then investigate the cause: look at the markers around the failure (TestStatus/FAIL/ERROR markers and the failing test's own "test" marker), inspect the test thread's activity and stacks at that time, and check any relevant log markers. Run \`profiler-cli guide\` if you need a refresher on the commands. Explain the most likely cause of the failure.`;
        navigator.clipboard.writeText(prompt).then(() => {
            el.classList.add('copied');
            setTimeout(() => el.classList.remove('copied'), 1000);
        });
    }

    function copyMachCmd(testPath, event) {
        const el = event.currentTarget;
        let text;
        if (isLocal && event.altKey) {
            const test = currentFailures?.tests.find(t => t.path === testPath);
            const msg = test?.commonMessage || test?.instances[0]?.message || '';
            text = `Follow the instructions in @../DEBUG_STANDALONE_TEST_FAILURES.md to debug this test failure.

\`${getMachCmd(testPath)}\`

Error: ${msg}`;
        } else {
            text = getMachCmd(testPath);
        }
        navigator.clipboard.writeText(text).then(() => {
            const prev = el.innerHTML;
            el.innerHTML = '&#x2713;';
            el.classList.add('copied');
            setTimeout(() => { el.innerHTML = prev; el.classList.remove('copied'); }, 1000);
        });
    }

    // Copies the raw data behind a row's counts: every execution of the test we
    // parsed, grouped by job name and job run, alongside the derived numbers. Use
    // it to check what the "failures / runs" ratio is built from.
    function copyDebugJson(testPath, event) {
        const el = event.currentTarget;
        const test = currentFailures?.tests.find(t => t.path === testPath);
        if (!test) return;

        const byJob = currentFailures.execsByTest.get(testPath);
        const jobs = [];
        for (const jobName of test.jobs) {
            const runs = byJob?.get(jobName);
            jobs.push({
                jobName,
                completedRunsOfThisJobName: currentJobRunCounts?.get(jobName) ?? null,
                profiledRuns: runs ? runs.size : 0,
                runs: Array.from(runs || [], ([runKey, execs]) => ({
                    runKey,
                    executions: execs.map(t => ({
                        status: t.status,
                        isRetry: !!t.isRetry,
                        startTime: t.timestamp,
                        durationMs: Math.round(t.duration),
                        intermittent: !!t.intermittent,
                        passedOnRetry: !!t.passedOnRetry,
                    })),
                })),
            });
        }

        const data = {
            test: test.path,
            revision: currentRevision,
            repo: currentRepo,
            derived: {
                failures: test.instances.length,
                totalJobs: test.totalJobs,
                seqRetryPasses: test.seqRetryPasses,
                statuses: Array.from(test.statuses),
            },
            jobs,
        };

        navigator.clipboard.writeText(JSON.stringify(data, null, 2)).then(() => {
            const prev = el.innerHTML;
            el.innerHTML = '&#x2713;';
            el.classList.add('copied');
            setTimeout(() => { el.innerHTML = prev; el.classList.remove('copied'); }, 1000);
        });
    }

    function toggleAssertions(link, groupId) {
        const items = document.querySelectorAll(`[data-group="${groupId}"]`);
        const hidden = items[0]?.style.display === 'none';
        for (const el of items) el.style.display = hidden ? '' : 'none';
        if (hidden) {
            link.textContent = 'show less';
        } else {
            link.textContent = `show ${items.length} more`;
        }
    }

    // ===== Reproduce =====

    // State: Map<testPath, { state, config, summary, duration, error, log, exitCode, status }>
    // state: null | 'pending' | 'queued' | 'running' | 'reproduced' | 'not_reproduced' | 'no_match' | 'error'
    let reproState = new Map();
    let reproWs = null;
    let reproRunning = false;
    let reproConfigs = null; // array of { name, local? } from server
    let reproHistoryFetched = false;
    let reproPendingCount = 0;

    // Map our platform/build to the best matching test-runner config name.
    // Config names look like "linux64-opt", "linux64-debug", "win64-asan", etc.
    // Returns the config name or null if no match.
    function findMatchingConfig(platform, buildTypes, configs) {
        if (!configs || configs.length === 0) return null;

        // Platform keywords to match against config names
        const platformKeywords = {
            'linux': 'linux',
            'windows': 'win',
            'mac': 'macos',
            'android': 'android',
        };
        const platKey = platformKeywords[platform];
        if (!platKey) return null;

        // Filter configs that match the platform
        const platConfigs = configs.filter(c => c.name.includes(platKey));
        if (platConfigs.length === 0) return null;

        // Only match build types the failure actually occurred on
        const buildPriority = ['opt', 'debug', 'ccov', 'asan', 'tsan'];
        for (const bt of buildPriority) {
            if (!buildTypes.includes(bt)) continue;
            const match = platConfigs.find(c => c.name.includes(bt));
            if (match) return match.name;
        }

        return null;
    }

    // For a test entry, find all matching configs to try reproduction, in priority order.
    // Prefers local configs over peers, and faster builds within each tier.
    function findMatchingConfigsForTest(test) {
        if (!reproConfigs) return [];

        // Collect unique platform+build combos, sorted by build speed
        const combos = [];
        const seen = new Set();
        for (const inst of test.instances) {
            const platform = extractPlatform(inst.jobName);
            const builds = extractBuildTypes(inst.jobName);
            const key = platform + ':' + builds.join(',');
            if (seen.has(key)) continue;
            seen.add(key);
            combos.push({ platform, builds });
        }

        // Sort combos: prefer opt, then debug, then sanitizers
        const buildSpeed = { 'opt': 0, 'debug': 1, 'ccov': 2, 'asan': 3, 'tsan': 4 };
        combos.sort((a, b) => {
            const aSpeed = Math.min(...a.builds.map(bt => buildSpeed[bt] ?? 5));
            const bSpeed = Math.min(...b.builds.map(bt => buildSpeed[bt] ?? 5));
            return aSpeed - bSpeed;
        });

        // Try local configs first, then peers
        const result = [];
        const added = new Set();
        const localConfigs = reproConfigs.filter(c => c.local);
        const peerConfigs = reproConfigs.filter(c => !c.local);
        for (const configs of [localConfigs, peerConfigs]) {
            if (configs.length === 0) continue;
            for (const { platform, builds } of combos) {
                const config = findMatchingConfig(platform, builds, configs);
                if (config && !added.has(config)) {
                    added.add(config);
                    result.push(config);
                }
            }
        }
        return result;
    }

    function updateReproduceButton() {
        const btn = document.getElementById('reproduce-btn');
        if (!btn || !isLocal) return;

        if (reproRunning) {
            btn.disabled = true;
            btn.title = `Reproduction in progress (${reproPendingCount} remaining)`;
            btn.textContent = `Reproducing... (${reproPendingCount})`;
        } else if (!currentFailures || currentFailures.tests.length === 0) {
            btn.disabled = true;
            btn.title = 'Load failures first';
            btn.textContent = 'Reproduce Failures';
        } else {
            btn.disabled = false;
            btn.title = 'Connect to local test-runner and attempt to reproduce failures';
            btn.textContent = 'Reproduce Failures';
        }
    }

    function connectReproServer() {
        try {
            reproWs = new WebSocket('ws://localhost:3000');
        } catch (e) {
            return;
        }

        reproWs.onerror = function() {
            if (reproRunning) {
                reproRunning = false;
                reproPendingCount = 0;
                updateReproduceButton();
                setStatus('Failed to connect to test-runner at ws://localhost:3000', true);
            }
            reproWs = null;
        };

        reproWs.onclose = function() {
            if (reproRunning) {
                reproRunning = false;
                reproPendingCount = 0;
                updateReproduceButton();
                renderTable();
            }
            reproWs = null;
        };

        reproWs.onmessage = function(event) {
            const msg = JSON.parse(event.data);
            handleReproMessage(msg);
        };
    }

    function reproduceFailures() {
        if (!isLocal || reproRunning || !currentFailures || currentFailures.tests.length === 0) return;

        reproRunning = true;
        updateReproduceButton();

        if (!reproWs || reproWs.readyState !== WebSocket.OPEN) {
            // Reconnect if needed; sendAllRunRequests will fire on configs message
            connectReproServer();
        } else {
            // Already connected, send immediately
            sendAllRunRequests();
        }
    }

    function handleReproMessage(msg) {
        if (msg.type === 'configs') {
            reproConfigs = msg.configs;
            if (reproRunning && reproPendingCount === 0) {
                sendAllRunRequests();
            } else if (reproRunning) {
                // New peer configs arrived — queue tests that had no_match before.
                queueNewlyMatchableTests();
            } else {
                // Not reproducing — fetch history then mark remaining tests as no_match.
                // Only fetch once; subsequent config broadcasts just update no_match state.
                if (!reproHistoryFetched) {
                    reproHistoryFetched = true;
                    fetchReproHistory().then(markNoMatchTests);
                } else {
                    markNoMatchTests();
                }
            }
        } else if (msg.type === 'run_queued') {
            const testPath = requestIdToTest.get(msg.request_id);
            if (testPath && reproState.has(testPath)) {
                const s = reproState.get(testPath);
                s.state = 'queued';
                s.runId = msg.run_id;
                runIdToTest.set(msg.run_id, testPath);
            }
            updateReproIcon(testPath);
        } else if (msg.type === 'run_started') {
            const testPath = runIdToTest.get(msg.run_id);
            if (testPath && reproState.has(testPath)) {
                reproState.get(testPath).state = 'running';
            }
            updateReproIcon(testPath);
        } else if (msg.type === 'run_completed') {
            const testPath = requestIdToTest.get(msg.request_id);
            const prevConfig = msg.config || requestIdToConfig.get(msg.request_id);
            if (testPath && reproState.has(testPath)) {
                const s = reproState.get(testPath);
                s.state = msg.reproduced ? 'reproduced' : 'not_reproduced';
                s.summary = msg.summary;
                s.duration = msg.duration_seconds;
                s.exitCode = msg.exit_code;
                s.status = msg.status;

                // If not reproduced and there are remaining configs to try, queue the next one
                if (!msg.reproduced && s.remainingConfigs && s.remainingConfigs.length > 0) {
                    // Save the completed attempt
                    if (!s.pastAttempts) s.pastAttempts = [];
                    s.pastAttempts.push({
                        config: s.config, runId: s.runId, summary: s.summary,
                        duration: s.duration, exitCode: s.exitCode, status: s.status,
                    });
                    const nextConfig = s.remainingConfigs.shift();
                    s.state = 'queued';
                    s.config = nextConfig;
                    s.runId = null;
                    s.summary = null;
                    s.duration = null;
                    s.exitCode = null;
                    // reproPendingCount stays the same (not decremented, not re-incremented)
                    if (!configQueues.has(nextConfig)) configQueues.set(nextConfig, []);
                    const queue = configQueues.get(nextConfig);
                    queue.push({ testPath, config: nextConfig });
                    if (queue.length === 1) {
                        sendRunRequest(queue.shift());
                    }
                    sendNextForConfig(prevConfig);
                    updateReproduceButton();
                    updateReproIcon(testPath);
                    return;
                }

                // If not reproduced (no more configs to try), verify the test actually ran
                if (!msg.reproduced && s.runId) {
                    verifyTestRan(s.runId, testPath);
                }
            }
            reproPendingCount--;
            sendNextForConfig(prevConfig);
            updateReproduceButton();
            checkReproComplete();
            updateReproIcon(testPath);
        } else if (msg.type === 'run_error') {
            const testPath = requestIdToTest.get(msg.request_id);
            if (testPath && reproState.has(testPath)) {
                const s = reproState.get(testPath);
                s.state = 'error';
                s.error = msg.error;
            }
            reproPendingCount--;
            const config = requestIdToConfig.get(msg.request_id);
            sendNextForConfig(config);
            updateReproduceButton();
            checkReproComplete();
            updateReproIcon(testPath);
        }
    }

    // Maps for correlating request/run IDs back to test paths and configs
    let requestIdToTest = new Map();
    let requestIdToConfig = new Map();
    let runIdToTest = new Map();
    let nextRequestId = 0;
    // Per-config queue: Map<configName, Array<{testPath, config}>>
    let configQueues = new Map();

    function sendAllRunRequests() {
        requestIdToTest.clear();
        requestIdToConfig.clear();
        runIdToTest.clear();
        configQueues.clear();
        nextRequestId = 0;
        reproPendingCount = 0;

        // Build per-config queues
        for (const test of getFilteredTests()) {
            // Skip tests that already have a final cached result
            const existing = reproState.get(test.path);
            if (existing && existing.cached && (existing.state === 'reproduced' || existing.state === 'not_reproduced')) {
                continue;
            }
            // Skip tests already reproduced from a past attempt's retry
            if (existing && existing.state === 'reproduced') {
                continue;
            }

            // If we have a pending entry with past attempts (from cached history), use its state
            let config, remainingConfigs, pastAttempts;
            if (existing && existing.state === 'pending' && existing.pastAttempts) {
                config = existing.config;
                remainingConfigs = existing.remainingConfigs || [];
                pastAttempts = existing.pastAttempts;
            } else {
                const configs = findMatchingConfigsForTest(test);
                if (configs.length === 0) {
                    reproState.set(test.path, { state: 'no_match', config: null, testPath: test.path });
                    continue;
                }
                config = configs[0];
                remainingConfigs = configs.slice(1);
                pastAttempts = undefined;
            }

            reproState.set(test.path, { state: 'queued', config, testPath: test.path, remainingConfigs, pastAttempts });
            reproPendingCount++;

            if (!configQueues.has(config)) configQueues.set(config, []);
            configQueues.get(config).push({ testPath: test.path, config });
        }

        if (reproPendingCount === 0) {
            reproRunning = false;
            if (reproWs) { reproWs.close(); reproWs = null; }
        } else {
            // Send the first test for each config
            for (const [config, queue] of configQueues) {
                if (queue.length > 0) {
                    sendRunRequest(queue.shift());
                }
            }
        }

        updateReproduceButton();
        renderTable();
    }

    function markNoMatchTests() {
        if (!currentFailures) return;
        for (const test of getFilteredTests()) {
            const existing = reproState.get(test.path);
            if (existing && existing.state !== 'no_match') continue;
            const configs = findMatchingConfigsForTest(test);
            if (configs.length === 0) {
                reproState.set(test.path, { state: 'no_match', config: null, testPath: test.path });
            } else {
                reproState.set(test.path, { state: 'pending', config: configs[0], testPath: test.path, remainingConfigs: configs.slice(1) });
            }
            updateReproIcon(test.path);
        }
    }

    function queueNewlyMatchableTests() {
        for (const test of getFilteredTests()) {
            const existing = reproState.get(test.path);
            if (!existing || existing.state !== 'no_match') continue;

            const configs = findMatchingConfigsForTest(test);
            if (configs.length === 0) continue;

            const config = configs[0];
            reproState.set(test.path, { state: 'queued', config, testPath: test.path, remainingConfigs: configs.slice(1) });
            reproPendingCount++;

            if (!configQueues.has(config)) configQueues.set(config, []);
            const queue = configQueues.get(config);
            queue.push({ testPath: test.path, config });

            // If this is a new config with nothing in-flight, send immediately
            if (queue.length === 1) {
                sendRunRequest(queue.shift());
            }

            updateReproIcon(test.path);
        }
        updateReproduceButton();
    }

    function sendRunRequest(item) {
        const reqId = 'req-' + (nextRequestId++);
        requestIdToTest.set(reqId, item.testPath);
        requestIdToConfig.set(reqId, item.config);

        reproWs.send(JSON.stringify({
            type: 'run',
            request_id: reqId,
            test: item.testPath,
            config: item.config,
            extra_args: getExtraArgs(),
        }));
    }

    async function verifyTestRan(runId, testPath) {
        try {
            const resp = await fetch(`http://localhost:3000/api/runs/${encodeURIComponent(runId)}/log`);
            if (!resp.ok) return;
            const text = await resp.text();

            // Cache formatted log for the viewer
            reproLogCache.set(runId, formatStructuredLog(text));

            // Check if any test_start line references our test
            let testRan = false;
            for (const line of text.split('\n')) {
                let entry;
                try { entry = JSON.parse(line); } catch { continue; }
                if (entry.action === 'test_start' && entry.test === testPath) {
                    testRan = true;
                    break;
                }
            }

            if (!testRan) {
                const s = reproState.get(testPath);
                if (s && s.state === 'not_reproduced') {
                    s.state = 'error';
                    s.error = 'Test did not run — check log for infrastructure errors';
                    updateReproIcon(testPath);
                }
            }
        } catch (e) {
            // Can't verify, leave as-is
        }
    }

    function sendNextForConfig(config) {
        if (!config || !configQueues.has(config)) return;
        const queue = configQueues.get(config);
        if (queue.length > 0) {
            sendRunRequest(queue.shift());
        }
    }

    async function fetchReproHistory() {
        try {
            const resp = await fetch('http://localhost:3000/api/history');
            if (!resp.ok) return;
            const data = await resp.json();
            if (!data.runs || !currentFailures) return;

            // Filter non-stale entries, group by test path, keep most recent
            const bestByTest = new Map();
            for (const run of data.runs) {
                if (run.stale) continue;
                const existing = bestByTest.get(run.test);
                if (!existing || run.finished_at > existing.finished_at) {
                    bestByTest.set(run.test, run);
                }
            }

            // Match against current failure table
            for (const test of currentFailures.tests) {
                if (reproState.has(test.path)) continue; // don't overwrite live repro
                const run = bestByTest.get(test.path);
                if (!run) continue;

                if (run.reproduced) {
                    reproState.set(test.path, {
                        state: 'reproduced', config: run.config, testPath: test.path,
                        runId: run.run_id, summary: null, duration: run.duration_seconds,
                        exitCode: run.exit_code, status: run.status, cached: true,
                    });
                } else {
                    // Check if there are other configs to try beyond the cached one
                    const allConfigs = findMatchingConfigsForTest(test);
                    const remaining = allConfigs.filter(c => c !== run.config);
                    if (remaining.length === 0) {
                        reproState.set(test.path, {
                            state: 'not_reproduced', config: run.config, testPath: test.path,
                            runId: run.run_id, summary: null, duration: run.duration_seconds,
                            exitCode: run.exit_code, status: run.status, cached: true,
                        });
                    } else {
                        // Show the cached attempt as a past attempt, mark as pending for retry
                        reproState.set(test.path, {
                            state: 'pending', config: remaining[0], testPath: test.path,
                            remainingConfigs: remaining.slice(1),
                            pastAttempts: [{
                                config: run.config, runId: run.run_id, summary: null,
                                duration: run.duration_seconds, exitCode: run.exit_code, status: run.status,
                            }],
                        });
                    }
                }
            }

            updateResetButton();
            renderTable();
        } catch (e) {
            // Server not running or network error — silently continue
        }
    }

    function clearCachedReproResults() {
        for (const [path, rs] of reproState) {
            if (rs.cached) reproState.delete(path);
        }
        updateResetButton();
        renderTable();
    }

    function updateResetButton() {
        const btn = document.getElementById('repro-reset-btn');
        if (!btn || !isLocal) return;
        let hasCached = false;
        for (const [, rs] of reproState) {
            if (rs.cached) { hasCached = true; break; }
        }
        btn.style.display = hasCached ? '' : 'none';
    }

    function checkReproComplete() {
        if (reproPendingCount <= 0) {
            reproRunning = false;
            if (reproWs) {
                reproWs.close();
                reproWs = null;
            }
            updateReproduceButton();
        }
    }

    function updateReproIcon(testPath) {
        const cell = document.getElementById('repro-icon-' + testPath);
        if (cell) cell.innerHTML = reproIconHtml(testPath);

        // Update expanded detail row if visible
        const rs = reproState.get(testPath);
        const detailRow = document.getElementById('repro-detail-' + testPath);
        if (detailRow && rs) {
            const hasRepro = reproState.size > 0;
            const tmp = document.createElement('tbody');
            tmp.innerHTML = renderReproDetailRow(rs, hasRepro);
            detailRow.replaceWith(tmp.firstElementChild);
            loadVisibleReproLogs();
        }
    }

    function reproIconHtml(testPath) {
        const s = reproState.get(testPath);
        if (!s) return '';

        const cached = s.cached ? ' (cached)' : '';
        switch (s.state) {
            case 'pending': {
                let title = `Can reproduce on ${s.config}`;
                if (s.remainingConfigs && s.remainingConfigs.length > 0)
                    title += `\nThen: ${s.remainingConfigs.join(', ')}`;
                return `<span class="repro-icon repro-pending-idle" title="${escapeAttr(title)}">?</span>`;
            }
            case 'queued': {
                let title = `Queued: ${s.config}`;
                if (s.remainingConfigs && s.remainingConfigs.length > 0)
                    title += `\nThen: ${s.remainingConfigs.join(', ')}`;
                return `<span class="repro-icon repro-pending" title="${escapeAttr(title)}">&#x23F3;</span>`;
            }
            case 'running': {
                let title = `Reproducing on ${s.config}`;
                if (s.remainingConfigs && s.remainingConfigs.length > 0)
                    title += `\nThen: ${s.remainingConfigs.join(', ')}`;
                return `<span class="repro-icon repro-pending" title="${escapeAttr(title)}">&#x23F3;</span>`;
            }
            case 'reproduced':
                return `<span class="repro-icon repro-reproduced" title="Reproduced on ${escapeAttr(s.config)}${s.summary ? '\n' + escapeAttr(s.summary) : ''}${cached}">&#x2713;</span>`;
            case 'not_reproduced':
                return `<span class="repro-icon repro-not-reproduced" title="Not reproduced on ${escapeAttr(s.config)}${s.summary ? '\n' + escapeAttr(s.summary) : ''}${cached}">&#x2717;</span>`;
            case 'no_match':
                return '<span class="repro-icon repro-no-match" title="No matching local config available">&#x26A0;</span>';
            case 'error':
                return `<span class="repro-icon repro-error" title="Error: ${escapeAttr(s.error || 'unknown')}">!</span>`;
            default:
                return '';
        }
    }

    // ===== Console API =====

    function getSortedFailures() {
        if (!currentFailures) return [];

        let tests = getFilteredTests();
        const col = currentSort.column;
        const asc = currentSort.ascending;
        tests = [...tests].sort((a, b) => {
            let va, vb;
            if (col === 'count') { va = a.instances.length; vb = b.instances.length; }
            else if (col === 'test') { va = a.path; vb = b.path; }
            else if (col === 'status') {
                va = Array.from(a.statuses).sort().join(',');
                vb = Array.from(b.statuses).sort().join(',');
            }
            if (typeof va === 'string') return asc ? va.localeCompare(vb) : vb.localeCompare(va);
            return asc ? va - vb : vb - va;
        });

        const globalPlatforms = currentFailures.globalPlatforms;
        const globalBuildTypes = currentFailures.globalBuildTypes;

        return tests.map(test => {
            const allPlatforms = test.sortedPlatforms.length === globalPlatforms.size &&
                test.sortedPlatforms.every(p => globalPlatforms.has(p));
            const allBuildTypes = test.sortedBuildTypes.length === globalBuildTypes.size &&
                test.sortedBuildTypes.every(b => globalBuildTypes.has(b));
            return {
                test: test.path,
                count: test.instances.length,
                statuses: Array.from(test.statuses),
                platforms: allPlatforms ? 'all' : test.sortedPlatforms,
                buildTypes: allBuildTypes ? 'all' : test.sortedBuildTypes,
                flaky: test.intermittentCount === test.instances.length,
                message: test.commonMessage
                    ? test.commonMessage.split('\n')[0]
                    : undefined,
            };
        });
    }

    function logFailures(list) {
        console.table(list.map(f => ({
            '#': f.count,
            test: f.test,
            statuses: f.statuses.join(', '),
            platforms: Array.isArray(f.platforms) ? f.platforms.join(', ') : f.platforms,
            buildTypes: Array.isArray(f.buildTypes) ? f.buildTypes.join(', ') : f.buildTypes,
            flaky: f.flaky,
            message: f.message || '',
        })));
    }

    window.formatForPrompt = function(list) {
        return list.map(f => {
            let line = f.test;
            const isFlaky = f.flaky ? ' is flaky' : ' permafails';
            line += isFlaky;
            const config = [];
            if (f.platforms !== 'all') config.push(f.platforms.join(', '));
            if (f.buildTypes !== 'all') config.push(f.buildTypes.join(', '));
            if (config.length) line += ' on ' + config.join(' ');
            if (f.message) line += ' with `' + f.message + '`';
            return line;
        }).join('\n');
    };

    Object.defineProperty(window, 'failures', { get() {
        const list = getSortedFailures();
        logFailures(list);
        return list;
    }});

    Object.defineProperty(window, 'permaFails', { get() {
        const list = getSortedFailures().filter(f => !f.flaky);
        logFailures(list);
        return list;
    }});

    function logConsoleAPI() {
        console.log(
            '%cConsole API available',
            'font-weight: bold; font-size: 14px; color: #2563eb'
        );
        console.log(
            `%c  failures%c    — all failures sorted as on page\n` +
            `%c  permaFails%c  — same, excluding flaky failures\n\n` +
            `    Each entry: { test, count, statuses, platforms, buildTypes, flaky, message }\n` +
            `    • platforms/buildTypes: array of names, or "all" if present on every config\n` +
            `    • flaky: true if failure was intermittent in all runs (didn't happen in every job)\n` +
            `    • message: first line of failure message (if consistent across instances)\n` +
            `    Also logs a console.table() for quick viewing.\n\n` +
            `  formatForPrompt(list) — pretty-prints for use as a Claude prompt\n\n` +
            `  Example: copy(formatForPrompt(permaFails))`,
            'color: #059669; font-weight: bold', 'color: inherit',
            'color: #059669; font-weight: bold', 'color: inherit'
        );
    }

    // ===== Init =====

    document.addEventListener('DOMContentLoaded', function() {
        const params = new URLSearchParams(window.location.search);
        const rev = params.get('rev');
        const repo = params.get('repo');
        // Seed the filter from the URL before loading so updateUrlState() (called
        // during load, before the filter UI is shown) doesn't clear the param.
        const filter = params.get('filter');
        if (filter) {
            document.getElementById('search-box').value = filter;
            const raw = filter.toLowerCase();
            currentSearchNegate = raw.startsWith('!');
            currentSearchTerm = currentSearchNegate ? raw.slice(1) : raw;
        }
        // Seed "All jobs" before loading, for the same reason. Set explicitly
        // rather than only when present, so a browser-preserved checkbox state
        // can't disagree with the URL after a reload.
        document.getElementById('alljobs-checkbox').checked = params.has('alljobs');
        if (rev) {
            const prefix = repo && repo !== 'try' ? repo + ':' : '';
            document.getElementById('revision-input').value = prefix + rev;
            loadRevision();
        }

        document.getElementById('revision-input').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') loadRevision();
        });
    });
    </script>
</body>
